server {
    listen 80;
    server_name _;

    # SIP / DXF / allotment uploads (backend limit MAX_UPLOAD_MB defaults to 50)
    client_max_body_size 60m;

    root /usr/share/nginx/html;
    index index.html;

    # API -> backend container; the /api prefix is stripped
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;      # large reports / drawings / DXF imports
        proxy_send_timeout 300s;
    }

    # static assets are content-hashed by Vite -> cache them long
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # single-page app
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
